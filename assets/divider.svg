<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 70" width="1200" height="70" role="presentation">
<defs><style>
.disp{font-family:Impact,'Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif}
.mono{font-family:'Courier New','DejaVu Sans Mono',monospace}
.jp{font-family:'Noto Sans JP','Yu Gothic','Hiragino Sans','MS Gothic',sans-serif}
.glitch{animation:glitch 5s steps(1) infinite}
@keyframes glitch{0%,89%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(-4px,1px);opacity:.9}92%{transform:translate(4px,-1px);opacity:.9}95%{transform:translate(-2px,1px);opacity:.9}98%{transform:translate(0,0);opacity:0}}
.br{animation:br 3s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}}
.iris{transform-box:fill-box;transform-origin:center;animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#e10600" stop-opacity="0"/><stop offset="1" stop-color="#e10600"/></linearGradient><linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#e10600"/><stop offset="1" stop-color="#e10600" stop-opacity="0"/></linearGradient><g id="lily"><path d="M0,0 L0,30" stroke="#5a0000" stroke-width="2" fill="none"/><g stroke="#ff1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M0,0 C-6,-14 -20,-24 -32,-22"/><path d="M0,0 C-2,-18 -10,-32 -18,-38"/><path d="M0,0 C1,-20 4,-34 11,-40"/><path d="M0,0 C5,-15 17,-26 30,-26"/><path d="M0,0 C6,-10 20,-15 33,-11"/><path d="M0,0 C-6,-9 -20,-13 -33,-9"/></g><g fill="#ff4a3a"><circle cx="-32" cy="-22" r="1.8"/><circle cx="-18" cy="-38" r="1.8"/><circle cx="11" cy="-40" r="1.8"/><circle cx="30" cy="-26" r="1.8"/><circle cx="33" cy="-11" r="1.8"/><circle cx="-33" cy="-9" r="1.8"/></g></g></defs>
<rect x="40" y="34" width="500" height="2" fill="url(#fadeL)"/><rect x="660" y="34" width="500" height="2" fill="url(#fadeR)"/>
<path d="M60,28 H540" stroke="#e10600" stroke-width="8" stroke-dasharray="1.5 6" opacity=".6"/><path d="M660,28 H1140" stroke="#e10600" stroke-width="8" stroke-dasharray="1.5 6" opacity=".6"/>
<circle r="3" cy="35" fill="#ff1a1a"><animate attributeName="cx" values="60;540;60" dur="6s" repeatCount="indefinite"/></circle>
<circle r="3" cy="35" fill="#ff1a1a"><animate attributeName="cx" values="1140;660;1140" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="35" r="22" fill="#e10600" opacity=".25" class="pulse"/><circle cx="600" cy="35" r="14" fill="#e10600" class="pulse"/>
<g transform="translate(558,60)"><g><animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" dur="4s" repeatCount="indefinite"/><use xlink:href="#lily" href="#lily"/></g></g>
<g transform="translate(642,60)"><g><animateTransform attributeName="transform" type="rotate" values="4 0 0;-4 0 0;4 0 0" dur="4.6s" repeatCount="indefinite"/><use xlink:href="#lily" href="#lily"/></g></g>
<g class="br" fill="#e10600" font-size="14" font-family="monospace"><text x="30" y="40">+</text><text x="1160" y="40">+</text></g></svg>