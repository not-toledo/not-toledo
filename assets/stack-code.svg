L"</tspan><tspan fill="#7a746c">, </tspan><tspan fill="#ff6a5a">"CSS"</tspan><tspan fill="#7a746c">, </tspan><tspan fill="#ff6a5a">"React"</tspan><tspan fill="#7a746c">]</tspan><tspan fill="#7a746c">,</tspan></text></g><g class="ln" style="animation-delay:2.75s"><text x="200" y="252" class="mono" font-size="13" font-weight="700" fill="#e10600" opacity=".55">06</text><text x="274" y="252" class="mono" font-size="17"><tspan fill="#b8b0a4">backend</tspan><tspan fill="#7a746c">: </tspan><tspan fill="#7a746c">[</tspan><tspan fill="#ff6a5a">"Node.js"</tspan><tspan fill="#7a746c">, </tspan><tspan fill="#ff6a5a">"Spring Boot"</tspan><tspan fill="#7a746c">]</tspan><tspan fill="#7a746c">,</tspan></text></g><g class="ln" style="animation-delay:3.20s"><text x="200" y="280" class="mono" font-size="13" font-weight="700" fill="#e10600" opacity=".55">07</text><text x="274" y="280" class="mono" font-size="17"><tspan fill="#b8b0a4">banco</tspan><tspan fill="#7a746c">: </tspan><tspan fill="#7a746c">[</tspan><tspan fill="#ff6a5a">"MySQL"</tspan><tspan fill="#7a746c">, </tspan><tspan fill="#ff6a5a">"PostgreSQL"</tspan><tspan fill="#7a746c">]</tspan><tspan fill="#7a746c">,</tspan></text></g><g class="ln" style="animation-delay:3.65s"><text x="200" y="308" class="mono" font-size="13" font-weight="700" fill="#e10600" opacity=".55">08</text><text x="274" y="308" class="mono" font-size="17"><tspan fill="#b8b0a4">ferramentas</tspan><tspan fill="#7a746c">: </tspan><tspan fill="#7a746c">[</tspan><tspan fill="#ff6a5a">"Git"</tspan><tspan fill="#7a746c">, </tspan><tspan fill="#ff6a5a">"GitHub"</tspan><tspan fill="#7a746c">, </tspan><tspan fill="#ff6a5a">"VS Code"</tspan><tspan fill="#7a746c">, </tspan><tspan fill="#ff6a5a">"Linux"</tspan><tspan fill="#7a746c">]</tspan><tspan fill="#7a746c">,</tspan></text></g><g class="ln" style="animation-delay:4.10s"><text x="200" y="336" class="mono" font-size="13" font-weight="700" fill="#e10600" opacity=".55">09</text><text x="274" y="336" class="mono" font-size="17"><tspan fill="#b8b0a4">status</tspan><tspan fill="#7a746c">: </tspan><tspan fill="#ff6a5a">"evoluindo ▲"</tspan><tspan fill="#7a746c">,</tspan></text></g><g class="ln" style="animation-delay:4.55s"><text x="200" y="364" class="mono" font-size="13" font-weight="700" fill="#e10600" opacity=".55">10</text><text x="252" y="364" class="mono" font-size="17"><tspan fill="#7a746c">};</tspan></text></g><g class="ln" style="animation-delay:5.00s"><text x="200" y="392" class="mono" font-size="13" font-weight="700" fill="#e10600" opacity=".55">11</text><text x="252" y="392" class="mono" font-size="17"><tspan fill="#f1ebe0">gabriel</tspan><tspan fill="#7a746c">.</tspan><tspan fill="#ff1a1a">compilar</tspan><tspan fill="#7a746c">();</tspan><tspan fill="#7a746c">  // ☕ + deadline = código</tspan></text></g>
